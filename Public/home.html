<!doctype html>
<html lang="pt-br">
  <head>
    <!-- metadados -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portifolio Desenvolvedora e Analista de sistemas, especializada em desenvolvimento de jogos, godot e gamemaker"
    />
    <meta name="author" content="Rosemarry/Zixxi Products" />

    <meta property="og:title" content="Portifolio Rosemarry/Zixxi" />
    <meta
      property="og:description"
      content="Esse é o meu portifolio, conheça meus projetos e minhas habilidades"
    />
    <meta property="og:type" content="website" />

    <!-- links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="/Sass/Css/main.css" />
    <link rel="shortcut icon" href="/assets/logo.svg" type="image/x-icon" />

    <!-- title -->
    <title>Portfolio</title>
  </head>
  <body class="container-fluid">
    <header class="row p-1">
      <nav class="text-center">
        <img
          src="/Assets/logo-portifolio.png"
          alt="logo do portifolio em forma de uma lua"
          class="i-sm ms-4 rounded-circle"
        />
      </nav>
    </header>

    <main class="row " data-bs-theme="dark">
      <div class="col-1"></div>
      <div class="col-10 shadow-lg rounded-3 pt-5 mt-3 text-center box">
        <h1 class="playwrite-gb-j fs-2">
          Olá, Seja Bem Vindo ao meu Portifolio
        </h1>

        <p class="playwrite-gb-j fs-1 fw-bold">
          Sou Rosemarry, mas pode me chamar de Zixxi
        </p>

        <img
          src="..\Assets\banner.png"
          alt=""
          class="mx-auto d-block img-fluid"
        />

        <br />

        <h2>Recem retirados do forno</h2>
        <div
          id="carouselExampleInterval"
          class="carousel slide "
          data-bs-ride="carousel"
        >


          <div class="carousel-inner carousel-dark">

            <div class="carousel-item active" data-bs-interval="10000">
              <img src="..\Assets\MagicNums.png" class="d-block w-50 img-thumbnail mx-auto d-block" alt="..." />
              <p><a href="https://zixxi-the-dreamer.itch.io/magic-nums" class="btn btn-outline-dark fs-2">Play Now</a></p>
            </div>


            <div class="carousel-item" data-bs-interval="2000">
              <img src="..\Assets\LuzesConhecimento.png" class="d-block w-50 img-thumbnail mx-auto d-block" alt="..." />
              <p><a href="https://zixxi-the-dreamer.itch.io/luzes-do-conhecimento-alphaxd" class="btn btn-outline-dark fs-2">Play Now</a></p>
            </div>
          </div>


          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleInterval"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>

          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleInterval"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>

        </div>

        <br>
        <br>

        <div
          class="btn-group playwrite-gb-j btn-group-lg"
          role="group"
          aria-label="Basic example"
        >
          <a href="sobre.html" class="btn btn-outline-dark fs-2">Sobre Mim</a>
          <a href="projetos.html" class="btn btn-outline-dark fs-2">Projetos</a>
        </div>

      </div>
      <div class="col-1"></div>
    </main>

    <footer class="row">
      <small class="text-white"
        >Feito por <a href="#" class="text-white">Rosemarry Munhoz</a></small
      >
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
